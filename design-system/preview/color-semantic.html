<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<div class="grid" style="grid-template-columns:repeat(3,1fr)">
  <div class="swatch"><div class="swatch-chip" style="background:#ef4444"></div><div class="swatch-name">error</div><div class="swatch-hex">#EF4444</div></div>
  <div class="swatch"><div class="swatch-chip" style="background:#f59e0b"></div><div class="swatch-name">warning</div><div class="swatch-hex">#F59E0B</div></div>
  <div class="swatch"><div class="swatch-chip" style="background:#6ee7a1"></div><div class="swatch-name">success</div><div class="swatch-hex">#6EE7A1</div></div>
</div>
<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
  <span class="chip" style="color:#6ee7a1;background:rgba(110,231,161,.12);border:1px solid rgba(110,231,161,.26)">已登顶</span>
  <span class="chip" style="color:#f59e0b;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.28)">待审核</span>
  <span class="chip" style="color:#ef4444;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.28)">未通过</span>
</div>
</body></html>
